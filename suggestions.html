<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suggestions - Bihar Tourism</title>
    <link rel="stylesheet" href="suggestion.css">
</head>
<body>
   <header style="
        color:white;
        text-align:center;
        padding:2rem 0;
        background:transparent;
        position:relative;
        z-index:5;
    ">
        <h1 style="
            font-family:'Kanit', sans-serif;
            font-size:3rem;
            margin:0;
            font-weight:700;
            letter-spacing:2px;
        ">
            Bihar Tourism
        </h1>

        <nav>
            <ul style="
                list-style:none;
                padding:0;
                margin:1rem 0 0 0;
                display:flex;
                justify-content:center;
                gap:2rem;
            ">
                <li><a href="index.html" style="
                    color:white;
                    text-decoration:none;
                    font-size:1.1rem;
                    padding:0.5rem 1rem;
                    border-radius:5px;
                    transition:0.3s ease;
                    display:inline-block;
                " onmouseover="this.style.backgroundColor='rgba(255,255,255,0.2)'"
                   onmouseout="this.style.backgroundColor='transparent'">
                   Home</a></li>

                <li><a href="about.html" style="
                    color:white;
                    text-decoration:none;
                    font-size:1.1rem;
                    padding:0.5rem 1rem;
                    border-radius:5px;
                    transition:0.3s ease;
                    display:inline-block;
                " onmouseover="this.style.backgroundColor='rgba(255,255,255,0.2)'"
                   onmouseout="this.style.backgroundColor='transparent'">
                   About</a></li>

                <li><a href="most-visited.html" style="
                    color:white;
                    text-decoration:none;
                    font-size:1.1rem;
                    padding:0.5rem 1rem;
                    border-radius:5px;
                    transition:0.3s ease;
                    display:inline-block;
                " onmouseover="this.style.backgroundColor='rgba(255,255,255,0.2)'"
                   onmouseout="this.style.backgroundColor='transparent'">
                   Most Visited Places</a></li>

                <li><a href="contact.html" style="
                    color:white;
                    text-decoration:none;
                    font-size:1.1rem;
                    padding:0.5rem 1rem;
                    border-radius:5px;
                    transition:0.3s ease;
                    display:inline-block;
                " onmouseover="this.style.backgroundColor='rgba(255,255,255,0.2)'"
                   onmouseout="this.style.backgroundColor='transparent'">
                   Contact Us</a></li>

                <li><a href="suggestions.html" style="
                    color:white;
                    text-decoration:none;
                    font-size:1.1rem;
                    padding:0.5rem 1rem;
                    border-radius:5px;
                    transition:0.3s ease;
                    display:inline-block;
                " onmouseover="this.style.backgroundColor='rgba(255,255,255,0.2)'"
                   onmouseout="this.style.backgroundColor='transparent'">
                   Suggestions</a></li>
            </ul>
        </nav>
    </header>
   
    <main>
        <section class="suggestions-section">
            <div class="form-container">
                <h2>We'd Love to Hear From You</h2>
                <p>Your feedback helps us improve our services. Please share your thoughts!</p>
                <form id="suggestionForm" class="suggestion-form">
                    <div class="input-group">
                        <input type="text" id="name" name="name" placeholder="Your Name" required>
                    </div>
                    <div class="input-group">
                        <input type="email" id="email" name="email" placeholder="Your Email" required>
                    </div>
                    <div class="input-group">
                        <textarea id="suggestion" name="suggestion" rows="5" placeholder="Your Suggestion" required></textarea>
                    </div>
                    <button type="submit">Submit Suggestion</button>
                </form>
            </div>
        </section>
    </main>
    <div id="popupMessage" class="popup-message">
        <p>Thank you for your suggestion!</p>
        <button onclick="closePopup()">Close</button>
    </div>
   
 <footer style="
    width:100%;
    padding:20px 0;
    text-align:center;
    font-family:'Poppins', sans-serif;
    background:rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color:white;
    font-size:18px;
    letter-spacing:1px;
    border-top:1px solid rgba(255,255,255,0.3);
    box-shadow:0 -4px 20px rgba(0,0,0,0.4);
    position:relative;
    margin-top:50px;
">
    <p style="
        margin:0;
        text-shadow:0 0 8px rgba(255,255,255,0.7);
        animation: glow 2s infinite alternate;
    ">
        © 2024 Bihar Tourism. All rights reserved.
    </p>
</footer>
    <script src="suggestion.js"></script>
</body>
</html>
